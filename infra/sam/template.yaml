AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BrickWise API - Express.js backend on Lambda via Web Adapter

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
  EcrRepositoryUri:
    Type: String
    Description: ECR repository URI for the API Docker image
  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Neon PostgreSQL connection string (decrypted from infra/secrets/production.enc.yaml)
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret (decrypted from infra/secrets/production.enc.yaml)
  RebrickableApiKey:
    Type: String
    NoEcho: true
    Description: Rebrickable API v3 key (decrypted from infra/secrets/production.enc.yaml)
  R2AccessKeyId:
    Type: String
    NoEcho: true
    Description: Cloudflare R2 access key ID (decrypted from infra/secrets/production.enc.yaml)
  R2SecretAccessKey:
    Type: String
    NoEcho: true
    Description: Cloudflare R2 secret access key (decrypted from infra/secrets/production.enc.yaml)
  R2Endpoint:
    Type: String
    NoEcho: true
    Description: Cloudflare R2 S3-compatible endpoint (decrypted from infra/secrets/production.enc.yaml)

Resources:
  BrickwiseApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: brickwise-api
      PackageType: Image
      ImageUri: !Sub "${EcrRepositoryUri}:${ImageTag}"
      Environment:
        Variables:
          PORT: "8080"
          NODE_ENV: !Ref Environment
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET: !Ref JwtSecret
          REBRICKABLE_API_KEY: !Ref RebrickableApiKey
          R2_ACCESS_KEY_ID: !Ref R2AccessKeyId
          R2_SECRET_ACCESS_KEY: !Ref R2SecretAccessKey
          R2_ENDPOINT: !Ref R2Endpoint
          R2_BUCKET_NAME: "brickwise-scan-images"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "https://lego.oruganti.in"
          AllowMethods:
            - "*"
          AllowHeaders:
            - "*"
          AllowCredentials: true
      Policies:
        - Statement:
            - Sid: BedrockInvokeModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-*"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-sonnet-*"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-haiku-*"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-sonnet-*"
    Metadata:
      DockerContext: ../../server
      Dockerfile: Dockerfile

Outputs:
  BrickwiseApiFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt BrickwiseApiFunction.Arn

  BrickwiseApiFunctionUrl:
    Description: Lambda Function URL
    Value: !GetAtt BrickwiseApiFunctionUrl.FunctionUrl
